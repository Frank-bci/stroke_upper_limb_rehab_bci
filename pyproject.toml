[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stroke-bci-mvp"
version = "0.1.0"
description = "BCI MVP pipeline for stroke upper-limb rehabilitation experiments."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "mne",
    "pyriemann",
    "PyYAML",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
