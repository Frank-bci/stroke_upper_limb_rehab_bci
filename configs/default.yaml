# =============================================================================
# BCI基线解码器配置文件
# 用于脑机接口运动想象任务的模型训练和在线检测
# =============================================================================

# -----------------------------------------------------------------------------
# 数据集配置：定义数据来源、采样参数和通道选择
# -----------------------------------------------------------------------------
dataset:
  # 数据集名称（synthetic表示合成数据集）
  name: synthetic
  # 随机种子，确保实验可重复性
  random_state: 7
  # 被试者数量
  n_subjects: 6
  # 每个被试的试验次数
  trials_per_subject: 60
  # 采样频率（Hz）
  sfreq: 160
  # 每个epoch的时间长度（秒）
  epoch_seconds: 4.0
  # EEG电极通道列表：选择额叶(F)、中央叶(C)、顶叶(P)的关键通道
  channels:
    - F3
    - Fz
    - F4
    - C3
    - Cz
    - C4
    - P3
    - Pz
    - P4

# -----------------------------------------------------------------------------
# 信号预处理配置：滤波参数设置
# -----------------------------------------------------------------------------
preprocessing:
  # 陷波滤波器频率（Hz），用于去除50Hz工频干扰
  notch_hz: 50
  # 带通滤波器频率范围（Hz），提取8-30Hz的运动想象相关频段（mu和beta节律）
  bandpass_hz: [8, 30]

# -----------------------------------------------------------------------------
# 数据质量过滤配置：排除低质量epoch的标准
# -----------------------------------------------------------------------------
quality:
  # 最低质量评分阈值（0-100）
  min_score: 70
  # 最大允许的信号幅值（微伏），超过此值视为伪影
  max_abs_uv: 150
  # 通道标准差的最小值（微伏），低于此值的通道可能失效
  min_channel_std_uv: 0.05
  # 最大坏道比例，超过此比例的epoch将被拒绝
  max_bad_channel_ratio: 0.35
  # 最大线路噪声比例，用于评估工频干扰程度
  max_line_noise_ratio: 0.35

# -----------------------------------------------------------------------------
# 模型配置：FBCSP（滤波器组共空间模式）+ LDA分类器
# -----------------------------------------------------------------------------
model:
  # 模型类型：滤波器组共空间模式 + 线性判别分析
  type: fbcsp_lda
  # 滤波器组划分：将8-30Hz分为4个子频带，分别提取特征
  bands:
    - [8, 12]    # mu节律低频段
    - [12, 16]   # mu节律高频段
    - [16, 24]   # beta节律低频段
    - [24, 30]   # beta节律高频段
  # CSP算法提取的特征成分数量
  csp_components: 4
  # 训练样本构造方式：online_windows 表示训练时使用与在线推理一致的滑动窗口
  training_mode: online_windows
  # 数据划分策略：synthetic 默认使用随机分层划分
  split_strategy: random
  # 测试集占比（25%的数据用于最终评估）
  test_size: 0.25

# -----------------------------------------------------------------------------
# 在线检测配置：实时BCI系统的滑动窗口和触发机制
# -----------------------------------------------------------------------------
online:
  # 滑动窗口长度（秒），每次分析1秒的信号
  window_seconds: 1.0
  # 滑动步长（秒），每0.25秒进行一次预测
  step_seconds: 0.25
  # 触发阈值：分类概率超过0.7时认为检测到意图
  trigger_threshold: 0.7
  # 连续窗口数：需要连续4个窗口都超过阈值才触发，提高稳定性
  consecutive_windows: 4
  # 不应期（秒）：触发后3秒内不再响应，避免重复触发
  refractory_seconds: 3.0
  # 任务开始时间（秒）：trial开始后0.5秒开始检测
  task_start_seconds: 0.5
  # 任务结束时间（秒）：trial在3.5秒时结束
  task_end_seconds: 3.5

calibration:
  # 在训练 split 上选择阈值时允许的最大误触发率
  max_false_trigger_rate: 0.1
  thresholds: [0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9]

# -----------------------------------------------------------------------------
# 输出配置：模型和结果的保存路径
# -----------------------------------------------------------------------------
outputs:
  # 输出目录
  dir: outputs/synthetic
  # 训练好的模型文件路径（joblib格式）
  model_path: outputs/synthetic/model.joblib
  # 离线评估指标（JSON格式），包含准确率、AUC、F1等
  offline_metrics_path: outputs/synthetic/offline_metrics.json
  # 会话报告（JSON格式）
  session_report_json: outputs/synthetic/session_report.json
  # 会话报告（Markdown格式），便于人类阅读
  session_report_md: outputs/synthetic/session_report.md
  threshold_calibration_json: outputs/synthetic/threshold_calibration.json
