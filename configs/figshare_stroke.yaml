dataset:
  name: figshare_stroke
  path: data/raw/figshare_stroke/edffile
  events_path: data/raw/figshare_stroke/task-motor-imagery_events.tsv
  sfreq: 160
  epoch_seconds: 2.0
  max_files: 6
  max_epochs: 480
  random_state: 7

preprocessing:
  notch_hz: 50
  bandpass_hz: [8, 30]

quality:
  min_score: 70
  max_abs_uv: 250
  min_channel_std_uv: 0.05
  max_bad_channel_ratio: 0.35
  max_line_noise_ratio: 0.35

model:
  type: fbcsp_lda
  bands:
    - [8, 12]
    - [12, 16]
    - [16, 24]
    - [24, 30]
  csp_components: 4
  training_mode: online_windows
  split_strategy: subject
  test_size: 0.25

online:
  window_seconds: 1.0
  step_seconds: 0.25
  trigger_threshold: 0.65
  consecutive_windows: 4
  refractory_seconds: 3.0
  task_start_seconds: 0.25
  task_end_seconds: 1.75

outputs:
  dir: outputs/figshare_stroke
  model_path: outputs/figshare_stroke/model.joblib
  offline_metrics_path: outputs/figshare_stroke/offline_metrics.json
  session_report_json: outputs/figshare_stroke/session_report.json
  session_report_md: outputs/figshare_stroke/session_report.md
