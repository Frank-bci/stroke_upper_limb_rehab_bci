dataset:
  name: physionet
  path: data/raw/physionet
  subjects: all
  runs: [4, 8, 12]
  sfreq: 160
  epoch_seconds: 4.0
  random_state: 7

preprocessing:
  notch_hz: 50
  bandpass_hz: [8, 30]

quality:
  min_score: 70
  max_abs_uv: 250
  min_channel_std_uv: 0.05
  max_bad_channel_ratio: 0.35
  max_line_noise_ratio: 0.35

model:
  type: fbcsp_lda
  bands:
    - [8, 12]
    - [12, 16]
    - [16, 24]
    - [24, 30]
  csp_components: 4
  training_mode: online_windows
  split_strategy: subject
  test_size: 0.25

online:
  window_seconds: 1.0
  step_seconds: 0.25
  trigger_threshold: 0.65
  consecutive_windows: 4
  refractory_seconds: 3.0
  task_start_seconds: 0.5
  task_end_seconds: 3.5

calibration:
  max_false_trigger_rate: 0.1
  cv_folds: 5
  thresholds: [0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9]

outputs:
  dir: outputs/physionet_full
  model_path: outputs/physionet_full/model.joblib
  offline_metrics_path: outputs/physionet_full/offline_metrics.json
  session_report_json: outputs/physionet_full/session_report.json
  session_report_md: outputs/physionet_full/session_report.md
  threshold_calibration_json: outputs/physionet_full/threshold_calibration.json
